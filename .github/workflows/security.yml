name: Security

# Local parity: `pnpm security:check`
# Manual on GitHub: `gh workflow run Security`

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Install verified scanners
        run: |
          node tooling/setup/setup-gitleaks.mjs
          node .agents/tooling/setup/setup-osv-scanner.mjs

      - name: Run security checks
        run: pnpm security:check
