name: DeepSec

# Manual-only security review.
# Select the branch to review when dispatching the workflow.
# No automatic push or pull_request triggers are enabled.

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Trusted base branch to compare against"
        type: string
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEEPSEC_MAX_FILES: "80"

jobs:
  analyze:
    name: Analyze changed files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changes
        id: files
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail

          git check-ref-format --branch "$BASE_REF" >/dev/null
          git fetch --no-tags origin "$BASE_REF"

          BASE_SHA="$(git merge-base HEAD "$(git rev-parse FETCH_HEAD)")"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          git diff --name-only --diff-filter=AMRC \
            "$BASE_SHA...HEAD" > deepsec-files.txt

          COUNT="$(wc -l < deepsec-files.txt | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "Files changed: $COUNT"

          if [ "$COUNT" -gt "$DEEPSEC_MAX_FILES" ]; then
            echo "::error::Changed file count exceeds DEEPSEC_MAX_FILES"
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "No changed files to review."
          fi

      - name: Restore trusted DeepSec configuration
        if: steps.files.outputs.count != '0'
        shell: bash
        env:
          BASE_SHA: ${{ steps.files.outputs.base_sha }}
        run: |
          set -euo pipefail

          git cat-file -e \
            "$BASE_SHA:.deepsec/deepsec.config.ts"

          git checkout "$BASE_SHA" -- .deepsec

      - name: Setup pnpm for DeepSec workspace
        if: steps.files.outputs.count != '0'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"

      - name: Setup Node.js
        if: steps.files.outputs.count != '0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install DeepSec
        if: steps.files.outputs.count != '0'
        working-directory: .deepsec
        run: pnpm install --frozen-lockfile

      - name: Analyze changes
        if: steps.files.outputs.count != '0'
        working-directory: .deepsec
        shell: bash
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI_BASE_URL: https://ai-gateway.vercel.sh/v1
        run: |
          set -euo pipefail

          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::error::AI_GATEWAY_API_KEY is required"
            exit 1
          fi

          pnpm exec deepsec process \
            --agent pi \
            --model xai/grok-4.6 \
            --thinking-level medium \
            --root "${{ github.workspace }}" \
            --files-from "${{ github.workspace }}/deepsec-files.txt" \
            2>&1 | tee "${{ github.workspace }}/deepsec.log"

      - name: Upload failure log
        if: failure() && steps.files.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepsec-failure-log
          path: deepsec.log
          if-no-files-found: ignore
          retention-days: 1
